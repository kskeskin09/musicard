name: Build PR

on:
  pull_request:
    branches:
      - "**"
    # Weblate PRs only touch localized string files, which cannot break a
    # build that the base branch already compiles. The default (unsuffixed)
    # `values/` directory is deliberately not listed, so English string
    # changes still build.
    paths-ignore:
      - "app/src/main/res/values-*/strings.xml"
      - "app/src/main/res/values-*/metrolist_strings.xml"
      - "fastlane/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Test builds from this repository are signed with the release key and use
      # the release application id, so each one installs as an update over the
      # previous build (or over the release) and keeps the user's data.
      # PRs from forks get no secrets; they fall back to a separate app with a
      # per-PR key so they can never replace the real install.
      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > app/release-signing.keystore
            echo "mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "mode=pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore PR debug keystore
        id: pr_keystore
        if: steps.signing.outputs.mode == 'pr'
        uses: actions/cache/restore@v6
        with:
          path: app/pr-debug.keystore
          key: pr-debug-keystore-${{ github.event.number }}

      - name: Generate PR debug keystore if not cached
        if: steps.signing.outputs.mode == 'pr' && steps.pr_keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore app/pr-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Musicard PR ${{ github.event.number }},O=Musicard,C=US"

      - name: Save PR debug keystore
        if: steps.signing.outputs.mode == 'pr' && steps.pr_keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: app/pr-debug.keystore
          key: ${{ steps.pr_keystore.outputs.cache-primary-key }}

      # Optimized (R8, non-debuggable) build so the test APK runs as fast as a release.
      - name: Build GMS Preview APK (Musicard Nightly)
        if: steps.signing.outputs.mode == 'release'
        run: ./gradlew --console=plain assembleGmsPreview --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          METROLIST_APPLICATION_ID: com.kskeskin09.musicard
          METROLIST_APP_NAME: Musicard Nightly
          METROLIST_BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
          METROLIST_DEBUG_KEYSTORE_PATH: release-signing.keystore
          METROLIST_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          METROLIST_DEBUG_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          METROLIST_DEBUG_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}

      - name: Build GMS Preview APK (fork PR)
        if: steps.signing.outputs.mode == 'pr'
        run: ./gradlew --console=plain assembleGmsPreview --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          METROLIST_APPLICATION_ID: com.kskeskin09.musicard.pr.p${{ github.event.number }}
          METROLIST_APP_NAME: Musicard PR ${{ github.event.number }}
          METROLIST_DEBUG_KEYSTORE_PATH: pr-debug.keystore
          PULL_REQUEST: "true"
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          DISCORD_APP_ID: ${{ secrets.DISCORD_APP_ID }}

      - name: Rename APK
        run: |
          cd app/build/outputs/apk/gms/preview
          APK=$(ls *.apk | head -1)
          if [ "${{ steps.signing.outputs.mode }}" = "release" ]; then
            mv "$APK" "Musicard-Nightly-PR-${{ github.event.number }}.apk"
          else
            mv "$APK" "Musicard-PR-${{ github.event.number }}.apk"
          fi
          ls -la

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.signing.outputs.mode == 'release' && 'Musicard-Nightly' || 'Musicard' }}-PR-${{ github.event.number }}
          path: app/build/outputs/apk/gms/preview/*.apk
